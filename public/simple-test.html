<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Generator - Простой тест</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f9f9f9;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .result {
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .success {
            border-color: #4CAF50;
            background: #f0fff0;
        }
        
        .error {
            border-color: #f44336;
            background: #fff0f0;
        }
        
        .character-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .character-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .character-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .detail-group {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 5px;
        }
        
        .detail-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        
        .abilities {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .ability {
            text-align: center;
            background: #e3f2fd;
            padding: 6px;
            border-radius: 3px;
        }
        
        .ability-name {
            font-weight: bold;
            color: #1976d2;
            font-size: 12px;
        }
        
        .ability-value {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎲 D&D Generator - Простой тест</h1>
        <p style="text-align: center; color: #666;">Проверка работы генератора персонажей</p>

        <div class="test-section">
            <h3>🔧 Тест API</h3>
            <button onclick="testAPI()">Тест API</button>
            <button onclick="testStats()">Статистика</button>
            <div id="api-result" class="result">Нажмите кнопку для тестирования</div>
        </div>

        <div class="test-section">
            <h3>⚔️ Генерация персонажей</h3>
            <button onclick="generateRandomCharacter()">Случайный персонаж</button>
            <button onclick="generateHumanFighter()">Человек-Воин</button>
            <button onclick="generateElfWizard()">Эльф-Волшебник</button>
            <div id="character-result" class="result">Нажмите кнопку для генерации</div>
        </div>

        <div class="test-section">
            <h3>🎵 Звук</h3>
            <button onclick="playSound()">Воспроизвести звук</button>
            <button onclick="stopSound()">Остановить звук</button>
            <div id="sound-result" class="result">Нажмите кнопку для тестирования звука</div>
        </div>
    </div>

    <script>
        const API_BASE = 'api/v3/enhanced-characters.php';
        let audio = null;

        async function makeRequest(action, params = {}) {
            const url = new URL(API_BASE, window.location.origin);
            url.searchParams.set('action', action);

            Object.keys(params).forEach(key => {
                url.searchParams.set(key, params[key]);
            });

            try {
                const response = await fetch(url);
                const data = await response.json();
                return data;
            } catch (error) {
                return {
                    success: false,
                    error: error.message
                };
            }
        }

        async function makePostRequest(action, params = {}) {
            const formData = new FormData();
            formData.append('action', action);

            Object.keys(params).forEach(key => {
                formData.append(key, params[key]);
            });

            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                return data;
            } catch (error) {
                return {
                    success: false,
                    error: error.message
                };
            }
        }

        function displayResult(elementId, data) {
            const element = document.getElementById(elementId);
            element.className = 'result';

            if (data.success) {
                element.classList.add('success');
            } else {
                element.classList.add('error');
            }

            element.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }

        function displayCharacter(elementId, character) {
            const element = document.getElementById(elementId);
            element.className = 'result success';

            let html = `
                <div class="character-card">
                    <div class="character-name">${character.name}</div>
                    <div><strong>Раса:</strong> ${character.race}</div>
                    <div><strong>Класс:</strong> ${character.class} (${character.level} уровень)</div>
                    <div><strong>Мировоззрение:</strong> ${character.alignment}</div>
                    
                    <div class="character-details">
                        <div class="detail-group">
                            <div class="detail-label">Характеристики</div>
                            <div class="abilities">
            `;

            // Характеристики
            const abilities = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
            const abilityNames = ['СИЛ', 'ЛОВ', 'ТЕЛ', 'ИНТ', 'МДР', 'ХАР'];

            abilities.forEach((ability, index) => {
                const value = character.abilities[ability];
                const modifier = character.modifiers[ability];
                html += `
                    <div class="ability">
                        <div class="ability-name">${abilityNames[index]}</div>
                        <div class="ability-value">${value} (${modifier >= 0 ? '+' : ''}${modifier})</div>
                    </div>
                `;
            });

            html += `
                            </div>
                        </div>
                        
                        <div class="detail-group">
                            <div class="detail-label">Боевые характеристики</div>
                            <div><strong>Хиты:</strong> ${character.hit_points}</div>
                            <div><strong>КД:</strong> ${character.armor_class}</div>
                            <div><strong>Скорость:</strong> ${character.speed} футов</div>
                        </div>
                        
                        <div class="detail-group">
                            <div class="detail-label">Описание</div>
                            <div>${character.description}</div>
                        </div>
                    </div>
                </div>
            `;

            element.innerHTML = html;
        }

        async function testAPI() {
            const result = document.getElementById('api-result');
            result.innerHTML = '<div style="color: #666; font-style: italic;">Тестирование API...</div>';

            const data = await makeRequest('test');
            displayResult('api-result', data);
        }

        async function testStats() {
            const result = document.getElementById('api-result');
            result.innerHTML = '<div style="color: #666; font-style: italic;">Получение статистики...</div>';

            const data = await makeRequest('stats');
            displayResult('api-result', data);
        }

        async function generateRandomCharacter() {
            const result = document.getElementById('character-result');
            result.innerHTML = '<div style="color: #666; font-style: italic;">Генерация случайного персонажа...</div>';

            const data = await makePostRequest('generate', {
                race: 'human',
                class: 'fighter',
                level: 1,
                gender: 'random',
                alignment: 'random'
            });

            if (data.success && data.character) {
                displayCharacter('character-result', data.character);
            } else {
                displayResult('character-result', data);
            }
        }

        async function generateHumanFighter() {
            const result = document.getElementById('character-result');
            result.innerHTML = '<div style="color: #666; font-style: italic;">Генерация человека-воина...</div>';

            const data = await makePostRequest('generate', {
                race: 'human',
                class: 'fighter',
                level: 1,
                gender: 'random',
                alignment: 'random'
            });

            if (data.success && data.character) {
                displayCharacter('character-result', data.character);
            } else {
                displayResult('character-result', data);
            }
        }

        async function generateElfWizard() {
            const result = document.getElementById('character-result');
            result.innerHTML = '<div style="color: #666; font-style: italic;">Генерация эльфа-волшебника...</div>';

            const data = await makePostRequest('generate', {
                race: 'elf',
                class: 'wizard',
                level: 1,
                gender: 'random',
                alignment: 'random'
            });

            if (data.success && data.character) {
                displayCharacter('character-result', data.character);
            } else {
                displayResult('character-result', data);
            }
        }

        function playSound() {
            const result = document.getElementById('sound-result');
            result.innerHTML = '<div style="color: #666; font-style: italic;">Воспроизведение звука...</div>';

            try {
                // Создаем простой звук
                const audioContext = new(window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);

                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.5);

                result.innerHTML = '<div style="color: green;">✅ Звук воспроизведен успешно!</div>';
            } catch (error) {
                result.innerHTML = '<div style="color: red;">❌ Ошибка воспроизведения звука: ' + error.message + '</div>';
            }
        }

        function stopSound() {
            const result = document.getElementById('sound-result');
            result.innerHTML = '<div style="color: #666;">🔇 Звук остановлен</div>';
        }

        // Автоматический тест при загрузке
        window.onload = function() {
            testAPI();
        };
    </script>
</body>

</html>
