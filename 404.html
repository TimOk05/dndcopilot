<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D&D Copilot - redirect</title>
  <script>
    const path = window.location.pathname;
    if (path.endsWith("/public/index.html/")) {
      window.location.replace(path.slice(0, -1) + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <p>Страница не найдена. Откройте <a href="/dndcopilot/">D&amp;D Copilot</a>.</p>
</body>
